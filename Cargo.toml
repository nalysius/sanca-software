[package]
name = "sanca_software"
version = "1.6.1"
edition = "2021"
description = "A scanner to discover what technologies are running on a remote host. Focus on providing evidences."
readme = "README.md"
keywords = ["scanner", "cybersecurity"]
categories = ["command-line-utilities"]
license = "0BSD"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
regex = "1.13.1"
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["blocking", "gzip", "json", "rustls-no-provider"], default-features = false }
aws-lc-rs = { version = "1.18.0", optional = true }
ring = { version = "0.17.4", optional = true } 
rustls = { version = "0.23.43", features = ["std", "tls12", "logging"], default-features = false }
tokio = "1.53.1"
futures = "0.3.34"
log = "0.4.34"
simple_logger = "5.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[features]
default = ["aws-lc-provider"]
ring-provider = ["ring", "rustls/ring"]
aws-lc-provider = ["aws-lc-rs", "rustls/aws_lc_rs"]